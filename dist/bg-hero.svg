<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" preserveAspectRatio="xMidYMid slice">
  <style>
    .w1 { animation: breathe1 9s ease-in-out infinite; }
    .w2 { animation: breathe2 13s ease-in-out infinite; }
    .w3 { animation: breathe3 7s ease-in-out infinite; }
    @keyframes breathe1 {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-28px); }
    }
    @keyframes breathe2 {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(22px); }
    }
    @keyframes breathe3 {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-16px); }
    }
  </style>
  <path class="w1" fill="rgba(255,255,255,0.09)"
    d="M0,310 C240,230 480,390 720,310 C960,230 1200,390 1440,310 L1440,560 L0,560 Z"/>
  <path class="w2" fill="rgba(255,255,255,0.07)"
    d="M0,370 C200,300 400,440 600,370 C800,300 1000,440 1200,370 C1320,330 1400,400 1440,370 L1440,560 L0,560 Z"/>
  <path class="w3" fill="rgba(255,255,255,0.05)"
    d="M0,430 C180,370 360,490 540,430 C720,370 900,490 1080,430 C1260,370 1350,460 1440,430 L1440,560 L0,560 Z"/>
</svg>
