<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <style>
    .f1 { animation: float1 10s ease-in-out infinite; }
    .f2 { animation: float2 14s ease-in-out infinite; }
    .f3 { animation: float3 8s  ease-in-out infinite; }
    .f4 { animation: float1 12s ease-in-out infinite 2s; }
    .f5 { animation: float2  9s ease-in-out infinite 4s; }
    .f6 { animation: float3 11s ease-in-out infinite 1s; }
    @keyframes float1 {
      0%, 100% { transform: translateY(0)    scale(1);    }
      50%       { transform: translateY(-20px) scale(1.04); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0)   scale(1);    }
      50%       { transform: translateY(18px) scale(0.97); }
    }
    @keyframes float3 {
      0%, 100% { transform: translateY(0)    rotate(0deg); }
      50%       { transform: translateY(-12px) rotate(5deg); }
    }
  </style>

  <!-- Large background circles -->
  <circle class="f1" cx="100"  cy="350" r="180" fill="rgba(59,130,246,0.06)"/>
  <circle class="f2" cx="600"  cy="100" r="220" fill="rgba(59,130,246,0.05)"/>
  <circle class="f3" cx="1100" cy="500" r="160" fill="rgba(59,130,246,0.06)"/>

  <!-- Medium circles -->
  <circle class="f4" cx="400"  cy="570" r="90"  fill="rgba(99,102,241,0.07)"/>
  <circle class="f5" cx="900"  cy="200" r="110" fill="rgba(59,130,246,0.05)"/>
  <circle class="f6" cx="1200" cy="350" r="130" fill="rgba(99,102,241,0.06)"/>

  <!-- Small floating dots (SMIL) -->
  <circle cx="200" cy="150" r="7" fill="rgba(59,130,246,0.18)">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-9;0,0" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="460" r="5" fill="rgba(59,130,246,0.22)">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,10;0,0" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="180" r="9" fill="rgba(99,102,241,0.18)">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-13;0,0" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="310" r="5" fill="rgba(59,130,246,0.22)">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,7;0,0" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="870" cy="590" r="6" fill="rgba(99,102,241,0.20)">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="9s" repeatCount="indefinite"/>
  </circle>
</svg>
